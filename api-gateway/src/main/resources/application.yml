server:
  port: 9056

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/client

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:9099/eureka/
  instance:
    prefer-ip-address: true
